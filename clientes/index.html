<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Área do cliente · Hint-data Research</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap"><style>:root{--bg:#F4EEE0;--card:#FBF7EE;--fg:#17120D;--mu:#5E523F;--li:#D8CDB6;--bronze:#7A5830;--alerta:#8E3B26}@media (prefers-color-scheme:dark){:root{--bg:#100C08;--card:#1B1510;--fg:#F4EEE0;--mu:#BDB093;--li:#3C3326;--bronze:#C9A36B;--alerta:#E0735B}}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Libre Franklin",system-ui,sans-serif}#porta{max-width:380px;margin:12vh auto 0;padding:28px 24px;background:var(--card);border:1px solid var(--li);border-radius:4px}#porta .wm{font-size:11px;letter-spacing:.14em;color:var(--bronze);font-weight:600}#porta h1{margin:4px 0 4px;font-size:20px}#porta p{margin:0 0 18px;color:var(--mu);font-size:14px}#porta label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}#porta input[type=text],#porta input[type=password]{width:100%;box-sizing:border-box;padding:10px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--li);border-radius:3px}#porta .lem{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px;color:var(--mu)}#porta button{margin-top:18px;width:100%;padding:11px;font:inherit;font-weight:600;color:#FBF7EE;background:var(--bronze);border:0;border-radius:3px;cursor:pointer}#porta .erro{color:var(--alerta);font-size:14px;min-height:20px;margin-top:10px}#porta .volta{display:block;margin-top:14px;font-size:13px;color:var(--mu)}#porta a{color:var(--bronze)}@media (max-width:420px){#porta{margin:8vh 16px 0}}</style></head><body><noscript><p style="padding:24px">Esta página precisa de JavaScript.</p></noscript><form id="porta" hidden autocomplete="on" data-area=""><span class="wm">HINT-DATA RESEARCH</span><h1>Área do cliente</h1><p>Acesso restrito. Entre com o login e a senha que recebeu.</p><label for="u">Login</label><input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required><label for="s">Senha</label><input id="s" name="password" type="password" autocomplete="current-password" required><label class="lem"><input id="l" type="checkbox"> Lembrar neste aparelho</label><button type="submit">Entrar</button><div class="erro" id="e" role="alert"></div><a class="volta" href="https://hint-data.github.io/">← Hint-data Research</a><a class="volta" href="https://hint-data.github.io/encomendas/">Sobre os relatórios sob encomenda</a></form><script src="https://hint-data.github.io/clientes/assets/porta/porta.js"></script></body></html>
